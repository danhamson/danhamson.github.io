<h1>Pip</h1>
<p>Pip ist ein privater Kalender-Assistent für den persönlichen Gebrauch.</p>
<h2>Datenschutz</h2>
<p>Die App liest und ändert ausschließlich Termine im Google-Kalender ihres Eigentümers. Die Daten werden nur auf dessen eigenem Gerät gespeichert und nicht an Dritte weitergegeben.</p>
